# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # As configurações do Firebase vêm do segredo ENV_LOCAL (o conteúdo do
      # .env.local), nunca do repositório.
      - run: echo "$ENV_LOCAL" > .env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
      - run: flutter pub get
      - run: flutter build web --release --dart-define-from-file=.env.local
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALA_DE_JOGOS_7298F }}
          projectId: sala-de-jogos-7298f
