<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>CartaoConfig</title></head>
<body>

<div class="sj-palco col" style="max-width:420px;gap:12px">
  <div class="sj-cartao">
    <div class="sj-cartao__topo"><span class="ms">groups</span><span class="sj-cartao__titulo">Espiões</span><span class="sj-cartao__valor">2</span></div>
    <p class="sj-cartao__sub">Com 8 jogadores, recomendamos 2.</p>
    <div class="sj-cartao__controle"><div class="sj-slider" style="--p:20%"><div class="sj-slider__trilho"></div><div class="sj-slider__cheio"></div><div class="sj-slider__polegar"></div></div></div>
  </div>
  <div class="sj-cartao sj-c-violeta">
    <div class="sj-cartao__topo"><span class="ms">timer</span><span class="sj-cartao__titulo">Tempo por rodada</span><button class="sj-switch" role="switch" aria-checked="true" aria-label="Tempo por rodada" style="--c:var(--violeta);--c-suave:var(--violeta-suave)"><span class="bulbo"></span></button></div>
    <p class="sj-cartao__sub">Cronômetro de 5 minutos na tela.</p>
  </div>
</div>

</body>
</html>
