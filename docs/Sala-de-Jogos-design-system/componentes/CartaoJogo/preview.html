<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>CartaoJogo</title></head>
<body>

<div class="sj-palco col" style="max-width:420px;gap:12px">
  <button class="sj-cartao-jogo sj-c-violeta">
    <span class="sj-poco"><span class="ms">visibility_off</span></span>
    <span class="sj-cartao-jogo__txt"><b>Quem é o Espião?</b><small>Um de vocês não sabe onde está.</small>
      <span class="sj-cartao-jogo__meta"><span class="sj-tag cor"><span class="ms">group</span>3–12</span><span class="sj-tag"><span class="ms">schedule</span>10 MIN</span></span></span>
    <span class="ms seta">chevron_right</span></button>
  <button class="sj-cartao-jogo sj-c-rosa is-pressionado">
    <span class="sj-poco"><span class="ms">help</span></span>
    <span class="sj-cartao-jogo__txt"><b>Pergunta Impostora</b><small>Alguém respondeu outra pergunta.</small>
      <span class="sj-cartao-jogo__meta"><span class="sj-tag cor"><span class="ms">group</span>3–10</span><span class="sj-tag"><span class="ms">schedule</span>15 MIN</span><span class="sj-tag novo">Novo</span></span></span>
    <span class="ms seta">chevron_right</span></button>
  <button class="sj-cartao-jogo sj-c-menta">
    <span class="sj-poco"><span class="ms">quiz</span></span>
    <span class="sj-cartao-jogo__txt"><b>Quiz da Vez</b><small>Perguntas rápidas, um celular.</small>
      <span class="sj-cartao-jogo__meta"><span class="sj-tag cor"><span class="ms">group</span>2–8</span><span class="sj-tag"><span class="ms">schedule</span>10 MIN</span></span></span>
    <span class="ms seta">chevron_right</span></button>
  <button class="sj-cartao-jogo sj-c-ceu is-indisponivel">
    <span class="sj-poco"><span class="ms">join_inner</span></span>
    <span class="sj-cartao-jogo__txt"><b>Nos Anéis</b><small>Descubra as regras dos três anéis.</small>
      <span class="sj-cartao-jogo__meta"><span class="sj-tag cor"><span class="ms">group</span>2–6</span><span class="sj-tag"><span class="ms">schedule</span>20 MIN</span><span class="sj-tag">Em breve</span></span></span>
    <span class="ms seta">chevron_right</span></button>
</div>

</body>
</html>
