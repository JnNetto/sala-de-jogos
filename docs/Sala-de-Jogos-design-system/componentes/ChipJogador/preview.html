<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ChipJogador</title></head>
<body>

<div class="sj-palco col" style="gap:14px">
  <div id="lista" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  <div><button class="sj-btn sj-btn--secundario sj-btn--compacto" id="add"><span class="ms">person_add</span>Adicionar jogador</button></div>
</div>
<script>
var nomes=['Ana','Bruno','Caio','Duda','Enzo','Fê','Gabi','Hugo','Iris'],cores=['violeta','rosa','menta','brasa','lampada','luar','ceu'],k=0,L=document.getElementById('lista');
function add(){var nm=nomes[k%nomes.length],c=cores[k%cores.length];k++;var d=document.createElement('span');d.className='sj-chip';d.innerHTML='<span class="sj-chip__avatar" style="--c:var(--'+c+')">'+nm[0]+'</span><span class="sj-chip__nome">'+nm+'</span><button class="sj-chip__x" aria-label="Remover '+nm+'"><span class="ms">close</span></button>';d.querySelector('button').onclick=function(){d.classList.add('sai');setTimeout(function(){d.remove()},150)};L.appendChild(d);}
for(var i=0;i<4;i++)add();document.getElementById('add').onclick=add;
</script>
</body>
</html>
