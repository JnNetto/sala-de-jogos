<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Contagem</title></head>
<body>

<div class="sj-palco" style="justify-content:center">
  <div class="sj-contagem sj-c-lampada"><svg viewBox="0 0 200 200"><circle class="trilho" cx="100" cy="100" r="88"/><circle class="anel" id="a" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/></svg><span class="sj-contagem__num" id="n">3</span></div>
</div>
<script>
var seq=['3','2','1','JÁ!'],i=0,n=document.getElementById('n'),a=document.getElementById('a');
function tick(){var v=seq[i%4];n.textContent=v;n.style.fontSize=v.length>1?'64px':'96px';n.classList.remove('pula');void n.offsetWidth;n.classList.add('pula');
a.style.transition='none';a.style.strokeDashoffset=0;void a.getBoundingClientRect();if(i%4<3){a.style.transition='stroke-dashoffset 1000ms linear';a.style.strokeDashoffset=553;}i++;}
tick();setInterval(tick,1000);
</script>
</body>
</html>
