<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Interruptor</title></head>
<body>

<div class="sj-palco" style="gap:28px">
  <button class="sj-switch" role="switch" aria-checked="false" aria-label="Sons"><span class="bulbo"></span></button>
  <button class="sj-switch" role="switch" aria-checked="true" aria-label="Vibração"><span class="bulbo"></span></button>
  <button class="sj-switch sj-c-rosa" role="switch" aria-checked="true" aria-label="Rodada relâmpago" style="--c:var(--rosa);--c-suave:var(--rosa-suave)"><span class="bulbo"></span></button>
  <span class="sj-rotulo">Toque para alternar</span>
</div>
<script>
document.querySelectorAll('.sj-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked', s.getAttribute('aria-checked')!=='true');});});
</script>
</body>
</html>
